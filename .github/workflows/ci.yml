name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-linux-x64:
    name: Verify Ubuntu 24.04 x64 on Ubicloud
    runs-on: ubicloud-standard-2
    timeout-minutes: 120

    env:
      CCACHE_DISABLE: "1"
      CI: "true"
      READLINE_MODE: bundled
      TITAN_MAX_GLIBC_VERSION: "2.39"
      TITAN_JOBS: "2"

    steps:
      - name: Check out vscode-titan
        uses: actions/checkout@v7.0.1
        with:
          path: vscode-titan
          persist-credentials: false

      - name: Check out pinned Titan compiler and standard library
        uses: actions/checkout@v7.0.1
        with:
          repository: mascarenhas/titan
          ref: 3a06055f4d84e4ca3eb9f8a31fd32aa65d6e6bce
          path: titan
          persist-credentials: false
          ssh-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: vscode-titan/package-lock.json

      - name: Install native and extension-host dependencies
        run: |
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install --no-install-recommends -y \
            binutils \
            build-essential \
            ca-certificates \
            cmake \
            curl \
            file \
            git \
            libasound2t64 \
            libatk-bridge2.0-0t64 \
            libatk1.0-0t64 \
            libcups2t64 \
            libdbus-1-3 \
            libdrm2 \
            libgbm1 \
            libgtk-3-0t64 \
            libnspr4 \
            libnss3 \
            libssl-dev \
            libtinfo-dev \
            libuv1-dev \
            libx11-xcb1 \
            libxcomposite1 \
            libxdamage1 \
            libxfixes3 \
            libxkbcommon0 \
            libxrandr2 \
            perl \
            pkg-config \
            unzip \
            xauth \
            xvfb

      - name: Identify the compiler installation cache
        id: compiler-identity
        working-directory: vscode-titan
        run: |
          echo "commit=$(git -C "$GITHUB_WORKSPACE/titan" rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          # Lua and LuaRocks launchers embed their absolute install prefix. A
          # runner with a different workspace layout must build its own cache.
          node --input-type=module -e '
            import { createHash } from "node:crypto";
            import { appendFileSync, realpathSync } from "node:fs";
            import path from "node:path";
            const prefix = path.join(realpathSync("."), ".titan");
            const identity = createHash("sha256").update(prefix).digest("hex");
            appendFileSync(process.env.GITHUB_OUTPUT, `prefix=${identity}\n`);
          '

      - name: Restore the pinned Titan compiler installation
        id: compiler-cache
        uses: ubicloud/cache/restore@v4
        with:
          path: vscode-titan/.titan
          # No fallback keys: another compiler revision is never a valid hit.
          # Bump the format when compiler build policy changes.
          key: titan-sdk-v1-ubuntu24.04-${{ runner.arch }}-readline-bundled-${{ steps.compiler-identity.outputs.commit }}-${{ steps.compiler-identity.outputs.prefix }}

      - name: Build the pinned Titan compiler and standard library
        if: steps.compiler-cache.outputs.cache-hit != 'true'
        working-directory: vscode-titan
        run: make -j2 toolchain TITAN_REPO="$GITHUB_WORKSPACE/titan"

      - name: Validate the compiler installation
        working-directory: vscode-titan
        run: |
          test -x .titan/bin/titanc
          test -s .titan/lib/titan/0.6/titan.a
          test -s .titan/include/titan/ffi.h
          test -s .titan/src/lua-5.5.1/lua.h
          .titan/bin/titanc --help

      - name: Cache the completed compiler installation
        if: steps.compiler-cache.outputs.cache-hit != 'true'
        uses: ubicloud/cache/save@v4
        with:
          path: vscode-titan/.titan
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}

      - name: Build the native server and test aggregate
        working-directory: vscode-titan
        run: make -j1 server server-test-build

      - name: Run two native test shards in parallel
        working-directory: vscode-titan
        run: make server-test-sharded

      - name: Run server protocol and Codex adapter regressions
        working-directory: vscode-titan
        run: make -j1 server-protocol-test codex-native-test

      - name: Run extension and shard-launcher unit tests
        working-directory: vscode-titan
        run: make -j1 extension-test shard-runner-test

      - name: Run the VS Code extension-host smoke test
        working-directory: vscode-titan
        run: xvfb-run -a make extension-host-test

      - name: Package the VSIX
        working-directory: vscode-titan
        run: make package TITAN_REPO="$GITHUB_WORKSPACE/titan"

      - name: Inspect packaged and standalone artifacts
        working-directory: vscode-titan
        run: make -j1 inspect-vsix inspect-server plugin-validate install-server-test TITAN_REPO="$GITHUB_WORKSPACE/titan"

      - name: Upload Linux x64 VSIX
        # The visible phases above run every `make verify` gate. Routine
        # verification must not turn red solely because account-wide artifact
        # storage is unavailable; an explicit manual artifact build stays strict.
        continue-on-error: ${{ github.event_name != 'workflow_dispatch' }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: titan-linux-x64-vsix
          path: vscode-titan/.build/vsix/titan-linux-x64.vsix
          if-no-files-found: error
          include-hidden-files: true
