name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-linux-x64:
    name: Verify Ubuntu 24.04 x64 on Ubicloud
    runs-on: ubicloud-standard-2
    timeout-minutes: 120

    env:
      CCACHE_DISABLE: "1"
      CI: "true"
      READLINE_MODE: bundled
      TITAN_MAX_GLIBC_VERSION: "2.39"

    steps:
      - name: Check out vscode-titan
        uses: actions/checkout@v7.0.1
        with:
          path: vscode-titan
          persist-credentials: false

      - name: Check out pinned Titan compiler and standard library
        uses: actions/checkout@v7.0.1
        with:
          repository: mascarenhas/titan
          ref: c7caae130175fce0b949017495a352b3f9561b2c
          path: titan
          persist-credentials: false
          ssh-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: vscode-titan/package-lock.json

      - name: Install native and extension-host dependencies
        run: |
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install --no-install-recommends -y \
            binutils \
            build-essential \
            ca-certificates \
            cmake \
            curl \
            file \
            git \
            libasound2t64 \
            libatk-bridge2.0-0t64 \
            libatk1.0-0t64 \
            libcups2t64 \
            libdbus-1-3 \
            libdrm2 \
            libgbm1 \
            libgtk-3-0t64 \
            libnspr4 \
            libnss3 \
            libssl-dev \
            libtinfo-dev \
            libuv1-dev \
            libx11-xcb1 \
            libxcomposite1 \
            libxdamage1 \
            libxfixes3 \
            libxkbcommon0 \
            libxrandr2 \
            perl \
            pkg-config \
            unzip \
            xauth \
            xvfb

      - name: Build, test, package, and inspect
        working-directory: vscode-titan
        run: xvfb-run -a make -j1 verify TITAN_REPO="$GITHUB_WORKSPACE/titan"

      - name: Upload Linux x64 VSIX
        # `make verify` above already requires and inspects the VSIX. Routine
        # verification must not turn red solely because account-wide artifact
        # storage is unavailable; an explicit manual artifact build stays strict.
        continue-on-error: ${{ github.event_name != 'workflow_dispatch' }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: titan-linux-x64-vsix
          path: vscode-titan/.build/vsix/titan-linux-x64.vsix
          if-no-files-found: error
          include-hidden-files: true
