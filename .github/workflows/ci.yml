name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-linux-x64:
    name: Verify Ubuntu 24.04 x64 on Ubicloud
    runs-on: ubicloud-standard-2
    timeout-minutes: 120

    env:
      CCACHE_DISABLE: "1"
      CI: "true"
      OPENSSL_MODE: system
      TITAN_MAX_GLIBC_VERSION: "2.39"
      TITAN_JOBS: "2"
      BUILD_PROFILE: validation

    steps:
      - name: Check out vscode-titan
        uses: actions/checkout@v7.0.1
        with:
          path: vscode-titan
          persist-credentials: false

      - name: Check out pinned Titan compiler and standard library
        uses: actions/checkout@v7.0.1
        with:
          repository: mascarenhas/titan
          ref: e9d3855e3429bb526cf3924eb32c5002fa99b0d0
          path: titan
          submodules: recursive
          persist-credentials: false
          ssh-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: vscode-titan/package-lock.json

      - name: Install native and extension-host dependencies
        run: |
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install --no-install-recommends -y \
            binutils \
            build-essential \
            gcc-14 \
            ca-certificates \
            cmake \
            curl \
            file \
            git \
            libasound2t64 \
            libatk-bridge2.0-0t64 \
            libatk1.0-0t64 \
            libcups2t64 \
            libdbus-1-3 \
            libdrm2 \
            libgbm1 \
            libgtk-3-0t64 \
            libnspr4 \
            libnss3 \
            libreadline-dev \
            libssl-dev \
            libtinfo-dev \
            libuv1-dev \
            libx11-xcb1 \
            libxcomposite1 \
            libxdamage1 \
            libxfixes3 \
            libxkbcommon0 \
            libxrandr2 \
            perl \
            pkg-config \
            python3-venv \
            unzip \
            xauth \
            xvfb

      - name: Identify the compiler installation cache
        id: compiler-identity
        working-directory: vscode-titan
        run: |
          echo "commit=$(git -C "$GITHUB_WORKSPACE/titan" rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          # Runtime lookup is relocatable, but LuaRocks build configuration still
          # records its install prefix. Keep build caches specific to that layout.
          node --input-type=module -e '
            import { createHash } from "node:crypto";
            import { appendFileSync, realpathSync } from "node:fs";
            import path from "node:path";
            const prefix = path.join(realpathSync("."), ".titan-validation");
            const identity = createHash("sha256").update(prefix).digest("hex");
            appendFileSync(process.env.GITHUB_OUTPUT, `prefix=${identity}\n`);
          '

      - name: Restore the pinned Titan compiler installation
        id: compiler-cache
        uses: ubicloud/cache/restore@v4
        with:
          # Packaging validates LuaRocks' installed version against these
          # licensing inputs from the unpacked dependency source.
          path: |
            vscode-titan/.titan-validation
            titan/luarocks-3.13.0/COPYING
            titan/luarocks-3.13.0/src/luarocks/core/cfg.lua
          # No fallback keys: another compiler revision is never a valid hit.
          # Bump the format when compiler build policy changes.
          key: titan-sdk-v6-luarocks-validation-titan-o0-lua-deps-optimized-ubuntu24.04-${{ runner.arch }}-readline-system-openssl-system-${{ steps.compiler-identity.outputs.commit }}-${{ steps.compiler-identity.outputs.prefix }}

      - name: Build the pinned Titan compiler and standard library
        if: steps.compiler-cache.outputs.cache-hit != 'true'
        working-directory: vscode-titan
        run: |
          make -j2 toolchain TITAN_REPO="$GITHUB_WORKSPACE/titan"

      - name: Validate the compiler installation
        working-directory: vscode-titan
        run: |
          test -x .titan-validation/bin/titanc
          test -s .titan-validation/lib/titan/0.6/titan.a
          test -s .titan-validation/include/titan/ffi.h
          test -s .titan-validation/src/lua-5.5.1/lua.h
          test "$(cat .titan-validation/etc/titan/build-profile)" = validation
          test -s "$GITHUB_WORKSPACE/titan/luarocks-3.13.0/COPYING"
          test -s "$GITHUB_WORKSPACE/titan/luarocks-3.13.0/src/luarocks/core/cfg.lua"
          .titan-validation/bin/titanc --help

      - name: Cache the completed compiler installation
        if: steps.compiler-cache.outputs.cache-hit != 'true'
        uses: ubicloud/cache/save@v4
        with:
          # Packaging validates LuaRocks' installed version against these
          # licensing inputs from the unpacked dependency source.
          path: |
            vscode-titan/.titan-validation
            titan/luarocks-3.13.0/COPYING
            titan/luarocks-3.13.0/src/luarocks/core/cfg.lua
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}

      - name: Build the native server and test aggregate
        working-directory: vscode-titan
        run: make -j2 server server-test-build

      - name: Run two native test shards in parallel
        working-directory: vscode-titan
        run: make server-test-sharded

      - name: Verify incremental native rebuilds
        working-directory: vscode-titan
        run: make incremental-build-test

      - name: Run server protocol and Codex adapter regressions
        working-directory: vscode-titan
        run: make -j1 server-protocol-test codex-native-test

      - name: Run extension and shard-launcher unit tests
        working-directory: vscode-titan
        run: make -j1 extension-test shard-runner-test

      - name: Run the VS Code extension-host smoke test
        working-directory: vscode-titan
        run: xvfb-run -a make extension-host-test

      - name: Build a disposable VSIX for validation
        working-directory: vscode-titan
        run: make package TITAN_REPO="$GITHUB_WORKSPACE/titan"

      - name: Inspect packaged and standalone artifacts
        working-directory: vscode-titan
        run: make -j1 inspect-vsix inspect-server plugin-validate install-server-test TITAN_REPO="$GITHUB_WORKSPACE/titan"

      - name: Prepare the pinned line coverage reporter
        working-directory: vscode-titan
        run: |
          python3 -m venv "$RUNNER_TEMP/titan-coverage-tools"
          "$RUNNER_TEMP/titan-coverage-tools/bin/pip" install gcovr==8.4

      - name: Build isolated measured server and native test images
        working-directory: vscode-titan
        run: |
          make -j2 server-coverage-build BUILD_ROOT=.build/coverage-native \
            CC=gcc-14 SERVER_COVERAGE_GCOV=gcov-14

      - name: Collect native and actual-server line coverage
        working-directory: vscode-titan
        run: xvfb-run -a make server-coverage-run

      - name: Render server line coverage
        working-directory: vscode-titan
        run: |
          make server-coverage-report \
            SERVER_COVERAGE_GCOVR="$RUNNER_TEMP/titan-coverage-tools/bin/gcovr"
          make server-coverage-report SERVER_COVERAGE_SCOPE=native \
            SERVER_COVERAGE_REPORT_DIR=.build/coverage/native-report \
            SERVER_COVERAGE_GCOVR="$RUNNER_TEMP/titan-coverage-tools/bin/gcovr"

      - name: Retain coverage reports and collection logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: titan-language-server-line-coverage
          include-hidden-files: true
          path: |
            vscode-titan/.build/coverage/report
            vscode-titan/.build/coverage/native-report
            vscode-titan/.build/coverage/build/logs
            vscode-titan/.build/coverage/build/*-image/build.json
            vscode-titan/.build/coverage/run/*.log
            vscode-titan/.build/coverage/run/*/run.json
            vscode-titan/.build/coverage/run/coverage-runs.json
          if-no-files-found: ignore
          retention-days: 7

      # Routine CI publishes no package or language-server binaries. A future
      # main-only release job must rebuild the SDK and server in production
      # after validation succeeds, rather than reuse this unoptimized graph.
