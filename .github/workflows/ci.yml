name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-linux-x64:
    name: Verify Ubuntu 24.04 x64 on Ubicloud
    runs-on: ubicloud-standard-2
    timeout-minutes: 120

    env:
      CCACHE_DISABLE: "1"
      CI: "true"
      OPENSSL_MODE: system
      TITAN_MAX_GLIBC_VERSION: "2.39"
      TITAN_JOBS: "2"
      BUILD_PROFILE: validation
      LUA_RELEASE: v5.5.1-1
      LUAROCKS_VERSION: "3.13.0"
      TITAN_RELEASE: v0.6.0
      TITAN_ROCK: titan-0.6.0-1.src.rock

    steps:
      - name: Check out vscode-titan
        uses: actions/checkout@v7.0.1
        with:
          path: vscode-titan
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: vscode-titan/package-lock.json

      - name: Install native and extension-host dependencies
        run: |
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install --no-install-recommends -y \
            binutils \
            build-essential \
            gcc-14 \
            ca-certificates \
            cmake \
            curl \
            file \
            gh \
            git \
            libasound2t64 \
            libatk-bridge2.0-0t64 \
            libatk1.0-0t64 \
            libcups2t64 \
            libdbus-1-3 \
            libdrm2 \
            libgbm1 \
            libgtk-3-0t64 \
            libnspr4 \
            libnss3 \
            libreadline-dev \
            libssl-dev \
            libtinfo-dev \
            libuv1-dev \
            libx11-xcb1 \
            libxcomposite1 \
            libxdamage1 \
            libxfixes3 \
            libxkbcommon0 \
            libxrandr2 \
            perl \
            pkg-config \
            python3-venv \
            unzip \
            xauth \
            xvfb

      - name: Identify the compiler installation cache
        id: compiler-identity
        working-directory: vscode-titan
        run: |
          # Runtime lookup is relocatable, but LuaRocks build configuration still
          # records its install prefix. Keep build caches specific to that layout.
          node --input-type=module -e '
            import { createHash } from "node:crypto";
            import { appendFileSync, realpathSync } from "node:fs";
            import path from "node:path";
            const prefix = path.join(realpathSync("."), ".titan-validation");
            const identity = createHash("sha256").update(prefix).digest("hex");
            appendFileSync(process.env.GITHUB_OUTPUT, `prefix=${identity}\n`);
            appendFileSync(process.env.GITHUB_ENV, `TITAN_PREFIX=${prefix}\n`);
          '

      - name: Restore the Titan release installation
        id: compiler-cache
        uses: ubicloud/cache/restore@v4
        with:
          path: vscode-titan/.titan-validation
          # No fallback keys: another release is never a valid hit.
          # Bump the format when compiler build policy changes.
          key: titan-sdk-v8-source-rock-validation-titan-o0-lua-deps-optimized-ubuntu24.04-${{ runner.arch }}-readline-system-openssl-system-${{ env.LUA_RELEASE }}-${{ env.LUAROCKS_VERSION }}-${{ env.TITAN_RELEASE }}-${{ env.TITAN_ROCK }}-${{ steps.compiler-identity.outputs.prefix }}

      - name: Download, build and install Lua 5.5.1
        if: steps.compiler-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/titan-sdk-sources/lua"
          cd "$RUNNER_TEMP/titan-sdk-sources"
          curl -fL --retry 3 -o lua.tar.gz \
            "https://github.com/mascarenhas/lua-5.5.1/archive/refs/tags/$LUA_RELEASE.tar.gz"
          tar -xzf lua.tar.gz --strip-components=1 -C lua
          make -C lua -j2 linux-readline PREFIX="$TITAN_PREFIX" \
            TITAN_LIBRARY_VERSION=0.6 CC=cc \
            MYCFLAGS='-fPIC -O2 -fno-lto' MYLDFLAGS='-O2 -fno-lto'
          make -C lua install PREFIX="$TITAN_PREFIX" TITAN_LIBRARY_VERSION=0.6

      - name: Download, build and install LuaRocks
        if: steps.compiler-cache.outputs.cache-hit != 'true'
        run: |
          cd "$RUNNER_TEMP/titan-sdk-sources"
          curl -fL --retry 3 -o luarocks.tar.gz \
            "https://luarocks.org/releases/luarocks-$LUAROCKS_VERSION.tar.gz"
          tar -xzf luarocks.tar.gz
          cd "luarocks-$LUAROCKS_VERSION"
          ./configure --prefix="$TITAN_PREFIX" --rocks-tree="$TITAN_PREFIX" \
            --with-lua="$TITAN_PREFIX" --force-config
          make LUA_DIR="$TITAN_PREFIX"
          make install LUA_DIR="$TITAN_PREFIX"

      - name: Download and install the Titan release source rock
        if: steps.compiler-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.TITAN_RELEASE_TOKEN }}
        run: |
          cd "$RUNNER_TEMP/titan-sdk-sources"
          if [ -n "$GH_TOKEN" ]; then
            gh release download "$TITAN_RELEASE" --repo mascarenhas/titan \
              --pattern "$TITAN_ROCK"
          else
            curl -fL --retry 3 -o "$TITAN_ROCK" \
              "https://github.com/mascarenhas/titan/releases/download/$TITAN_RELEASE/$TITAN_ROCK"
          fi
          PATH="$TITAN_PREFIX/bin:$PATH" TITAN_BUILD_PROFILE=validation \
            "$TITAN_PREFIX/bin/luarocks" install "$TITAN_ROCK"

      - name: Validate the compiler installation
        working-directory: vscode-titan
        run: |
          test -x "$TITAN_PREFIX/bin/titanc"
          test -s "$TITAN_PREFIX/lib/titan/0.6/titan.a"
          test -s "$TITAN_PREFIX/include/titan/ffi.h"
          test -s "$TITAN_PREFIX/src/lua-5.5.1/lua.h"
          test -s "$TITAN_PREFIX/share/titan/LICENSE"
          test "$(cat "$TITAN_PREFIX/etc/titan/build-profile")" = validation
          test "$("$TITAN_PREFIX/bin/titanc" --print-root)" = "$TITAN_PREFIX"
          "$TITAN_PREFIX/bin/titanc" --help

      - name: Cache the completed compiler installation
        if: steps.compiler-cache.outputs.cache-hit != 'true'
        uses: ubicloud/cache/save@v4
        with:
          path: vscode-titan/.titan-validation
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}

      - name: Build the native server and test aggregate
        working-directory: vscode-titan
        run: make -j2 server server-test-build

      - name: Run two native test shards in parallel
        working-directory: vscode-titan
        run: make server-test-sharded

      - name: Smoke-test compiler-owned incremental builds
        working-directory: vscode-titan
        run: make incremental-build-test

      - name: Run server protocol and Codex adapter regressions
        working-directory: vscode-titan
        run: make -j1 server-protocol-test codex-native-test

      - name: Run extension and shard-launcher unit tests
        working-directory: vscode-titan
        run: make -j1 extension-test shard-runner-test

      - name: Run the VS Code extension-host smoke test
        working-directory: vscode-titan
        run: xvfb-run -a make extension-host-test

      - name: Build a disposable VSIX for validation
        working-directory: vscode-titan
        run: make package

      - name: Inspect packaged and standalone artifacts
        working-directory: vscode-titan
        run: make -j1 inspect-vsix inspect-server plugin-validate install-server-test

      - name: Prepare optional rich coverage formats
        working-directory: vscode-titan
        run: |
          python3 -m venv "$RUNNER_TEMP/titan-coverage-tools"
          "$RUNNER_TEMP/titan-coverage-tools/bin/pip" install gcovr==8.4

      - name: Build the isolated covered native test aggregate
        working-directory: vscode-titan
        run: |
          make -j2 server-coverage-build BUILD_ROOT=.build/coverage-native \
            CC=gcc-14 SERVER_COVERAGE_GCOV=gcov-14 \
            SERVER_COVERAGE_FORMATS='html lcov cobertura' \
            SERVER_COVERAGE_GCOVR="$RUNNER_TEMP/titan-coverage-tools/bin/gcovr"

      - name: Run covered native tests and generate reports
        working-directory: vscode-titan
        run: make server-coverage-run

      - name: Retain coverage reports and collection logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: titan-language-server-line-coverage
          include-hidden-files: true
          path: |
            vscode-titan/.build/coverage/direct/report
            vscode-titan/.build/coverage/direct/logs
            vscode-titan/.build/coverage/direct/coverage-build.json
          if-no-files-found: ignore
          retention-days: 7

      # Routine CI publishes no package or language-server binaries. A future
      # main-only release job must rebuild the SDK and server in production
      # after validation succeeds, rather than reuse this unoptimized graph.
